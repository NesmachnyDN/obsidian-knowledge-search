<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Reference observations — synthetic redraw"><title>Reference observations — synthetic redraw</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui,sans-serif"><text x="40" y="45" font-size="26" font-weight="700" fill="#20232a">Reference observations — synthetic redraw</text><text x="40" y="74" font-size="14" fill="#626975">Original user captures inform these patterns; not actual screenshots.</text><text x="40" y="137" font-size="19" font-weight="700" fill="#20232a">Knowledge AI</text><path d="M40 147H860" stroke="#d8dbe2"/><rect x="40" y="154" width="820" height="54" rx="8" fill="#f8f8fa"/><text x="54" y="176" font-size="16" fill="#20232a">Providers / task assignment</text><text x="54" y="194" font-size="12" fill="#626975">Simple mode; per-task provider and model</text><rect x="746" y="167" width="96" height="28" rx="6" fill="white" stroke="#cbd0d8"/><text x="794" y="185" text-anchor="middle" font-size="13" fill="#353947">Configure</text><rect x="40" y="216" width="820" height="54" rx="8" fill="#f8f8fa"/><text x="54" y="238" font-size="16" fill="#20232a">Vector retrieval</text><text x="54" y="256" font-size="12" fill="#626975">Embedding source, preset model and readiness</text><rect x="808" y="231" width="34" height="19" rx="10" fill="#9380d9"/><circle cx="832" cy="240.5" r="7" fill="white"/><rect x="40" y="278" width="820" height="44" rx="7" fill="#f1f3f7"/><text x="54" y="305" font-size="14" fill="#444b59">Coverage and full re-index action sit beside vector configuration.</text><rect x="40" y="333" width="820" height="54" rx="8" fill="#f8f8fa"/><text x="54" y="355" font-size="16" fill="#20232a">OCR / vision indexing</text><text x="54" y="373" font-size="12" fill="#626975">Optional features</text><rect x="808" y="348" width="34" height="19" rx="10" fill="#cbd0d8"/><circle cx="818" cy="357.5" r="7" fill="white"/><text x="40" y="420" font-size="19" font-weight="700" fill="#20232a">OKS — observed flat layout</text><path d="M40 430H860" stroke="#d8dbe2"/><rect x="40" y="437" width="820" height="54" rx="8" fill="#f8f8fa"/><text x="54" y="459" font-size="16" fill="#20232a">Standalone indexing and search</text><text x="54" y="477" font-size="12" fill="#626975">Offline Markdown</text><rect x="808" y="452" width="34" height="19" rx="10" fill="#9380d9"/><circle cx="832" cy="461.5" r="7" fill="white"/><rect x="40" y="499" width="820" height="54" rx="8" fill="#f8f8fa"/><text x="54" y="521" font-size="16" fill="#20232a">Advanced local backend</text><text x="54" y="539" font-size="12" fill="#626975">Disabled in both supplied settings captures</text><rect x="808" y="514" width="34" height="19" rx="10" fill="#cbd0d8"/><circle cx="818" cy="523.5" r="7" fill="white"/><rect x="40" y="561" width="820" height="54" rx="8" fill="#f8f8fa"/><text x="54" y="583" font-size="16" fill="#20232a">Advanced profile / Python executable / health script</text><text x="54" y="601" font-size="12" fill="#626975">Still visible although the parent is disabled</text><rect x="40" y="623" width="820" height="44" rx="7" fill="#f1f3f7"/><text x="54" y="650" font-size="14" fill="#444b59">Finding: group by user task and disclose technical fields only when relevant.</text></g></svg>
