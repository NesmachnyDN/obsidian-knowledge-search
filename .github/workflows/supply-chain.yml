name: Dependency audit (develop)
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (high and critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit the committed lockfile, including dev dependencies
        run: npm audit --package-lock-only --audit-level=high
